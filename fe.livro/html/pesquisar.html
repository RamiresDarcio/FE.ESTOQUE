<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FE.ESTOQUE - Pesquisar</title>

    <link rel="stylesheet" href="/fe.livro/css/pesquisar.css">
</head>

<body>

    <main class="pesquisar">

        <!-- INFORMAÇÕES PRINCIPAIS -->
        <section class="informacoes-principais">

            <div class="titulo">
                <span>Nome do título</span>
            </div>

            <div class="genero">
                <span>Gênero</span>
            </div>

            <div class="autor">
                <span>Nome do autor</span>
            </div>

            <div class="editora">
                <span>Nome da editora</span>
            </div>

        </section>


        <!-- PARTE INFERIOR -->
        <section class="informacoes-produtos">

            <!-- LADO ESQUERDO -->
            <div class="produtos-esquerdo">

                <!-- IMAGEM -->
                <div class="imagem-produto">

                    <img 
                        src="" 
                        alt="Imagem do produto"
                        id="imagem_produtor"
                    >

                </div>


                <!-- INFORMAÇÕES -->
                <div class="detalha_produtos">

                    <p>
                        <strong>Resumo:</strong>
                    </p>

                    <p>
                        <strong>Gênero:</strong>
                    </p>

                    <p>
                        <strong>Idade:</strong>
                    </p>

                </div>

            </div>


            <!-- LADO DIREITO -->
            <div class="produtos-direito">

                <div class="preco">

                    <p>
                        <strong>Preço:</strong>
                    </p>

                </div>

                <div class="codigo">

                    <p>
                        <strong>Código:</strong>
                    </p>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
