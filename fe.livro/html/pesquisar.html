<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FE.ESTUQUE</title>
    <link rel="stylesheet" href="/fe.livro/css/pesquisar.css">
</head>
<body>
    <main class="pequisar">
        <section>
            <!--informações princiapais-->
            <div class="titulo">
                <span>Nome do tiulo</span>
            </div>
            <div class="genero">
                <span>Gênero</span>
            </div>
            <div>
                <span>Nome do autor</span>
            </div>
            <div>
                <span>Nome da editora</span>
            </div>
        </section>
        <!--parte inferior-->
        <section class="informacoes-produtos">
            <div class="produtos-esquerdo">
                <!--imagme do produtos-->
                <div>
                    <img src="" alt="imagem_do_produtosz" id="imagem_produtor">
                </div>
                <!--infomaçãso-->
                <div class="detalha_produtos">
                    <p>
                        <strong>resumo</strong>
                    </p>
                    <p>
                        <strong>Genero</strong>
                    </p>
                    <p>
                        <strong>Idade</strong>
                    </p>
                </div>
                <!--lado direitor-->
                <div class="produtos_direito">
                    <div class="preco">
                        <p>
                            <strong>Preço:</strong>
                        </p>
                    </div>
                    <div class="codigo">
                        <p>
                            <strong>codigo</strong>
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
