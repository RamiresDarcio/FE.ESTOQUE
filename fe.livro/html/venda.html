<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FE.ESTOQUE | Nova venda</title><link rel="stylesheet" href="../css/app.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="idex.html?dashboard=1">FE.ESTOQUE</a><nav class="nav"><a href="idex.html?dashboard=1">Dashboard</a><a class="active" href="venda.html">Nova venda</a><a href="vendas.html">Histórico</a><a href="pesquisar.html">Livros</a><button class="logout" data-logout>Sair</button></nav></header><main><div class="hero"><div><span class="eyebrow">Ponto de venda</span><h1>Nova venda</h1><p class="muted">Monte o carrinho e confirme a operação.</p></div></div><div class="message" data-message></div><div class="sale-layout"><section class="panel"><div class="field"><label for="client">Cliente</label><select id="client" data-client><option>Carregando...</option></select></div><div class="field"><label for="product-search">Pesquisar produto</label><input id="product-search" class="search" data-product-search placeholder="Título, autor, editora ou gênero"></div><div class="sale-products" data-product-results></div></section><section class="panel"><form data-sale-form><h2>Carrinho</h2><div class="cart" data-cart></div><div class="sale-line"><label for="discount">Desconto</label><div class="inline-fields"><input id="discount" data-discount type="number" min="0" step="0.01" value="0"><select data-discount-type><option value="fixo">R$</option><option value="percentual">%</option></select></div></div><div class="totals"><p>Subtotal <strong data-subtotal>R$ 0,00</strong></p><p>Desconto <strong data-discount-value>R$ 0,00</strong></p><p class="grand-total">Total <strong data-total>R$ 0,00</strong></p></div><div class="field"><label for="payment">Forma de pagamento</label><select id="payment" data-payment><option>Dinheiro</option><option>PIX</option><option>Cartão de Débito</option><option>Cartão de Crédito</option></select></div><p class="hint" data-payment-note></p><div class="field" data-cash><label for="cash-value">Valor recebido</label><input id="cash-value" data-cash-value type="number" min="0" step="0.01"></div><button class="button primary full-button" type="submit">Finalizar venda</button></form><div class="receipt" data-receipt hidden></div></section></div></main></div><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/venda.js"></script></body></html>
