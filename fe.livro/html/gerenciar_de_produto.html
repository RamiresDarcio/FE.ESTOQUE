<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FE.ESTOQUE | Gerenciar livro</title><link rel="stylesheet" href="../css/app.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="idex.html?dashboard=1">FE.ESTOQUE</a><nav class="nav"><a href="idex.html?dashboard=1">Dashboard</a><a href="pesquisar.html">Livros</a><button class="logout" data-logout>Sair</button></nav></header><main class="panel"><span class="eyebrow">Catálogo</span><h1 data-form-title>Cadastrar livro</h1><p class="muted">Preencha os dados do título para manter o estoque atualizado.</p><div class="message" data-message></div><form class="form-grid" data-book-form><div class="field"><label for="titulo">Título *</label><input id="titulo" name="titulo" required maxlength="200"></div><div class="field"><label for="autor">Autor *</label><input id="autor" name="autor" required maxlength="160"></div><div class="field"><label for="editora">Editora *</label><input id="editora" name="editora" required maxlength="160"></div><div class="field"><label for="genero">Gênero *</label><input id="genero" name="genero" required maxlength="100"></div><div class="field"><label for="anoPublicacao">Ano de publicação *</label><input id="anoPublicacao" name="anoPublicacao" type="number" min="1" max="9999" required></div><div class="field"><label for="preco">Preço *</label><input id="preco" name="preco" type="number" min="0" step="0.01" required></div><div class="field"><label for="quantidade">Quantidade *</label><input id="quantidade" name="quantidade" type="number" min="0" required></div><div class="field"><label for="imagem">URL da imagem</label><input id="imagem" name="imagem" type="url" maxlength="1000"></div><div class="field full"><label for="resumo">Resumo *</label><textarea id="resumo" name="resumo" required maxlength="4000"></textarea></div><div class="form-actions full"><a class="button secondary" href="pesquisar.html">Cancelar</a><button class="button primary" type="submit">Salvar livro</button></div></form></main></div><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script><script>loadBookForm();</script></body></html>
