<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FE>ESTOQUE- Gerenciar de pro</title>
</head>
<body>
    <main class="cadastro-produto">
        <!--parte de dados do produtos-->
        <section class="dados-p">
            <div class="campo">
                <label for="titulo">Titulo</label>
                <input type="text" id="titulo" placeholder="Digite o tìtulo">
            </div>
            <div class="campo">
                <label for="autor">Autor</label>
                <input type="text" id="autor" placeholder="Digite o autor">
            </div>
            <div class="campo">
                <label for="genero">Gênero</label>
                <input type="text" id="genero" placeholder="Digite o gênero">
            </div>
            <div class="campo_menor">
                <label for="ano">Ano de publicação</label>
                <input type="number" id="ano" placeholder="">
            </div>
            <div class="campo-menor">
                <label for="preco">Preços</label>
                <input type="number" id="preco"step="0.01" placeholder="R$">
            </div>
            <div class="cadastro_resumo_campo">
                <label for="resumo">resumo da obra</label>
                <textarea  id="resumo" placeholder="Digite o resumo da obra"></textarea>
            </div>
            <!-- lado da direito como foto e botão-->
             <section class="imagem_p">
                <div class="area-imagem">
                    <img src="" alt="imagem do produto" id="preview">
                </div>
                <input type="file" id="imagem" accept="imagem/*">
             </section>
             <!--botãoes-->
             <section class="acao">
                <button type="button" class="btn_cadastra" >cadastrar</button>
                <button type="button" class="btn_cancelar">calcelar</button>
             </section>
        </section>
    </main>
</body>
</html>
